<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; background: #1a1a1a; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  svg { max-width: 900px; width: 100%; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f1ea"/>
      <stop offset="100%" stop-color="#e4dfd3"/>
    </linearGradient>
    <linearGradient id="leatherBrown" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="50%" stop-color="#A0522D"/>
      <stop offset="100%" stop-color="#70360F"/>
    </linearGradient>
    <linearGradient id="leatherTan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CD853F"/>
      <stop offset="100%" stop-color="#8B5A2B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFFDD0"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <filter id="heavyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-opacity="0.4"/>
    </filter>
    <style>
      .grid-line { stroke: #d0c9bc; stroke-width: 1; stroke-dasharray: 4 4; }
      .cutting-knife { animation: cutPath 4s ease-in-out infinite; transform-box: fill-box; }
      .laser-glow { animation: laserSpark 4s ease-in-out infinite; }
      .raw-hide { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: drawHide 4s ease-in-out infinite; }
      @keyframes drawHide {
        0% { stroke-dashoffset: 1000; opacity: 1; }
        30% { stroke-dashoffset: 0; opacity: 1; }
        90% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes cutPath {
        0% { transform: translate(0, 0); opacity: 0; }
        5% { opacity: 1; }
        30% { transform: translate(160px, 0); }
        50% { transform: translate(160px, 110px); }
        70% { transform: translate(0, 110px); }
        85% { transform: translate(0, 0); opacity: 1; }
        90%, 100% { opacity: 0; }
      }
      @keyframes laserSpark {
        0%, 90%, 100% { r: 0; opacity: 0; }
        5%, 85% { r: 4; opacity: 1; }
      }
      .needle { animation: pierce 0.5s linear infinite; }
      .thread-line { stroke-dasharray: 8 6; animation: sew 3s linear infinite; }
      @keyframes pierce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(15px); }
      }
      @keyframes sew { to { stroke-dashoffset: -56; } }
      .stamp-press { animation: pressLogo 3s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
      .smoke-puff { animation: emitSmoke 3s ease-out infinite; transform-origin: 515px 230px; }
      .logo-burn { animation: burnIn 3s ease-in-out infinite; }
      @keyframes pressLogo {
        0%, 100% { transform: translateY(-40px); filter: drop-shadow(0 20px 10px rgba(0,0,0,0.15)); }
        30%, 45% { transform: translateY(3px); filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); }
        60% { transform: translateY(-40px); }
      }
      @keyframes emitSmoke {
        0%, 35% { opacity: 0; transform: scale(0.5) translateY(0); }
        40% { opacity: 0.6; transform: scale(1) translateY(-10px); filter: blur(2px); }
        50% { opacity: 0; transform: scale(1.5) translateY(-25px); filter: blur(5px); }
        100% { opacity: 0; }
      }
      @keyframes burnIn {
        0% { fill: #CD853F; opacity: 0; }
        35%, 45% { fill: #3a1d00; opacity: 1; filter: drop-shadow(0 0 2px #ff4500); }
        60%, 100% { fill: #4a2706; opacity: 1; filter: none; }
      }
      .wallet-wrapper { animation: floatWallet 4s ease-in-out infinite; }
      .wallet-flap { transform-origin: 670px 190px; animation: openWallet 4s ease-in-out infinite; }
      .cc-card1 { transform-origin: 670px 220px; animation: popCard1 4s ease-in-out infinite; }
      .cc-card2 { transform-origin: 710px 220px; animation: popCard2 4s ease-in-out infinite; }
      @keyframes floatWallet {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes openWallet {
        0%, 15%, 85%, 100% { transform: rotateX(0deg); }
        35%, 65% { transform: rotateX(-140deg); }
      }
      @keyframes popCard1 {
        0%, 25%, 75%, 100% { transform: translateY(0); }
        40%, 60% { transform: translateY(-35px) rotate(-5deg); }
      }
      @keyframes popCard2 {
        0%, 28%, 72%, 100% { transform: translateY(0); }
        43%, 57% { transform: translateY(-50px) rotate(5deg); }
      }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <g>
    <line x1="50" y1="50" x2="750" y2="50" class="grid-line"/>
    <line x1="50" y1="160" x2="750" y2="160" class="grid-line"/>
    <line x1="50" y1="380" x2="750" y2="380" class="grid-line"/>
    <line x1="70" y1="50" x2="70" y2="380" class="grid-line"/>
    <line x1="270" y1="50" x2="270" y2="380" class="grid-line"/>
    <line x1="570" y1="50" x2="570" y2="380" class="grid-line"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#8b7e66" letter-spacing="1">
    <text x="170" y="40" text-anchor="middle">1. PATTERN CUTTING</text>
    <text x="395" y="40" text-anchor="middle">2. AMISH STITCHING</text>
    <text x="515" y="40" text-anchor="middle">3. HOT STAMP</text>
    <text x="690" y="40" text-anchor="middle">4. WALLET</text>
  </g>
  <g transform="translate(90, 130)">
    <rect x="-10" y="-10" width="180" height="130" rx="4" fill="#a67049" opacity="0.3"/>
    <rect class="raw-hide" x="0" y="0" width="160" height="110" rx="8" fill="none" stroke="#5c3415" stroke-width="3" filter="url(#shadow)"/>
    <g class="cutting-knife">
      <line x1="0" y1="0" x2="0" y2="-20" stroke="#333" stroke-width="4"/>
      <circle cx="0" cy="-20" r="5" fill="#666"/>
      <line x1="0" y1="0" x2="0" y2="-3" stroke="#ff3300" stroke-width="2" class="laser-glow"/>
      <circle cx="0" cy="0" r="3" fill="#fff" class="laser-glow"/>
      <circle cx="0" cy="0" r="6" fill="#ff6600" opacity="0.7" class="laser-glow"/>
    </g>
  </g>
  <g transform="translate(310, 100)">
    <path d="M 10,140 L 160,140" stroke="url(#leatherBrown)" stroke-width="24" stroke-linecap="round" filter="url(#shadow)"/>
    <path d="M 10,132 L 160,132" stroke="#542507" stroke-width="1" opacity="0.6"/>
    <path class="thread-line" d="M 12,132 L 158,132" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.9"/>
    <g transform="translate(85, 80)">
      <g class="needle">
        <path d="M 0,-40 L 0,40 L -2,35 M 0,40 L 2,35" fill="none" stroke="url(#gold)" stroke-width="2"/>
        <ellipse cx="0" cy="25" rx="0.7" ry="4" fill="#222"/>
        <path d="M -20,15 Q -5,20 0,25 Q 10,30 25,45" fill="none" stroke="#fff" stroke-width="2"/>
      </g>
      <path d="M -12,-40 L -12,30 L -18,30 M 12,-40 L 12,30 L 18,30" fill="none" stroke="#999" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  <g transform="translate(430, 110)">
    <rect x="50" y="100" width="70" height="50" rx="6" fill="url(#leatherTan)" filter="url(#shadow)"/>
    <g class="logo-burn" transform="translate(85, 125) scale(0.7)">
      <path d="M -20,-15 L 20,-15 L 25,5 L 0,22 L -25,5 Z" fill="none" stroke="currentColor" stroke-width="3"/>
      <circle cx="0" cy="-2" r="6" fill="none" stroke="currentColor" stroke-width="2"/>
    </g>
    <circle class="smoke-puff" cx="75" cy="115" r="8" fill="#fff" opacity="0"/>
    <circle class="smoke-puff" cx="95" cy="110" r="12" fill="#fff" opacity="0"/>
    <g class="stamp-press" transform="translate(85, 115)">
      <rect x="-15" y="-90" width="30" height="70" fill="url(#gold)" rx="2"/>
      <rect x="-30" y="-20" width="60" height="20" fill="#444" rx="2"/>
      <path d="M -15,-2 L 15,-2 L 10,-8 L -10,-8 Z" fill="#ff6600" filter="drop-shadow(0 0 4px #ff3300)"/>
    </g>
  </g>
  <g class="wallet-wrapper" transform="translate(600, 160)" filter="url(#heavyShadow)">
    <g class="cc-card2">
      <rect x="40" y="45" width="45" height="30" rx="3" fill="url(#card2)"/>
      <rect x="45" y="52" width="12" height="4" fill="#fff" opacity="0.4"/>
    </g>
    <g class="cc-card1">
      <rect x="15" y="45" width="45" height="30" rx="3" fill="url(#card1)"/>
      <rect x="20" y="52" width="12" height="4" fill="#fff" opacity="0.4"/>
    </g>
    <rect x="5" y="65" width="95" height="70" rx="6" fill="#5c3415"/>
    <path d="M 5,90 L 100,90 M 5,110 L 100,110" stroke="#44250e" stroke-width="2"/>
    <path d="M 5,90 C 30,95 75,95 100,90" fill="none" stroke="#331a09" stroke-width="1"/>
    <path d="M 5,110 C 30,115 75,115 100,110" fill="none" stroke="#331a09" stroke-width="1"/>
    <rect x="7" y="67" width="91" height="66" rx="5" fill="none" stroke="#deba9d" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
    <g class="wallet-flap">
      <rect x="5" y="65" width="95" height="70" rx="6" fill="url(#leatherBrown)"/>
      <rect x="8" y="68" width="89" height="64" rx="4" fill="none" stroke="#ffdfb0" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>
      <path d="M 40,125 L 60,125 L 55,133 L 45,133 Z" fill="url(#gold)"/>
      <circle cx="50" cy="129" r="1.5" fill="#444"/>
      <g transform="translate(53, 93) scale(0.45)" fill="#44250e" opacity="0.8">
        <path d="M -20,-15 L 20,-15 L 25,5 L 0,22 L -25,5 Z" fill="none" stroke="currentColor" stroke-width="4"/>
        <circle cx="0" cy="-2" r="5" fill="currentColor"/>
      </g>
    </g>
  </g>
  <ellipse cx="170" cy="250" rx="60" ry="6" fill="#000" opacity="0.06"/>
  <ellipse cx="395" cy="250" rx="65" ry="6" fill="#000" opacity="0.06"/>
  <ellipse cx="515" cy="250" rx="40" ry="6" fill="#000" opacity="0.06"/>
  <ellipse cx="690" cy="315" rx="55" ry="8" fill="#000" opacity="0.15"/>
</svg>
</body>
</html>
